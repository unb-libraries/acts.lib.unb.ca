id: acts_events
name: 'ACTS Events'
description: 'Search index for Event nodes.'
read_only: false
field_settings:
  display_date:
    label: 'Display Date'
    datasource_id: 'entity:node'
    property_path: field_event_display_date
    type: string
    dependencies:
      config:
        - field.storage.node.field_event_display_date
  event_year:
    label: 'Event Year'
    property_path: event_year
    type: integer
    dependencies:
      module:
        - acts_core
  field_event_search_date:
    label: 'Event Date'
    datasource_id: 'entity:node'
    property_path: field_event_search_date
    type: date
    dependencies:
      config:
        - field.storage.node.field_event_search_date
  search_body:
    label: Annotation
    datasource_id: 'entity:node'
    property_path: field_annotation
    type: 'solr_text_custom:ngram'
    dependencies:
      config:
        - field.storage.node.field_annotation
  search_event_type:
    label: 'Event Type » Taxonomy term » Name'
    datasource_id: 'entity:node'
    property_path: 'field_event_type:entity:name'
    type: string
