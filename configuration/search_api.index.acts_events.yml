      config:
        - field.storage.node.field_event_type
      module:
        - taxonomy
  search_location:
    label: 'Location » Administrative area'
    datasource_id: 'entity:node'
    property_path: 'field_location:administrative_area'
    type: string
    dependencies:
      config:
        - field.storage.node.field_location
      module:
        - address
  search_company:
    label: 'Company » Content » Title'
    datasource_id: 'entity:node'
    property_path: 'field_company:entity:title'
    type: string
    dependencies:
      config:
        - field.storage.node.field_company
      module:
        - node
  search_person:
    label: 'Event Role » Role » Role Person » Content » Title'
    datasource_id: 'entity:node'
    property_path: 'field_event_role:entity:field_role_person:entity:title'
    type: string
    dependencies:
      config:
        - field.storage.node.field_event_role
        - field.storage.node.field_role_person
      module:
        - node
  search_theatre:
    label: 'Theatre » Content » Title'
    datasource_id: 'entity:node'
    property_path: 'field_theatre:entity:title'
    type: string
    dependencies:
      config:
        - field.storage.node.field_theatre
      module:
        - node
  search_work:
    label: 'Work » Content » Title'
    datasource_id: 'entity:node'
    property_path: 'field_work:entity:title'
    type: string
    dependencies:
      config:
        - field.storage.node.field_work
      module:
        - node
